[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arslm"
version = "0.1.0"
description = "Adaptive Recurrent State Language Model — lightweight on-premise AI engine with LoRA, RAG and adaptive recurrent attention"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Benjamin Amaad Kama", email = "benjokama@hotmail.fr" }
]
maintainers = [
    { name = "Benjamin Amaad Kama", email = "benjokama@hotmail.fr" }
]
keywords = [
    "llm",
    "language-model",
    "rag",
    "lora",
    "on-premise",
    "attention",
    "recurrent",
    "adaptive",
    "streamlit"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.41.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.23.0",

    # Data & utils
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "psutil>=5.9.0",
    "typing-extensions>=4.12.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Fine-tuning & PEFT
train = [
    "peft>=0.11.0",
    "datasets>=2.19.0",
    "trl>=0.8.0",
]

# RAG
rag = [
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=3.0.0",
]

# Web UI
ui = [
    "streamlit>=1.28.0",
]

# API server
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "aiofiles>=23.0.0",
]

# Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

# All optional features
all = [
    "arslm[train,rag,ui,api,dev]",
]

[project.urls]
Homepage = "https://github.com/benjaminpolydeq/ARSLM"
Repository = "https://github.com/benjaminpolydeq/ARSLM"
Issues = "https://github.com/benjaminpolydeq/ARSLM/issues"
Documentation = "https://github.com/benjaminpolydeq/ARSLM#readme"

[project.scripts]
arslm = "arslm.cli.commands:main"
# Décommente quand les modules existent réellement :
# arslm-server = "arslm.api.server:run_server"
# arslm-train = "arslm.cli.train:train_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["arslm*"]
exclude = ["tests*", "docs*", "notebooks*", "apps*", "scripts*", "lora*"]

[tool.setuptools.package-data]
arslm = ["py.typed"]

# ========== Tooling ==========

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["arslm"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["arslm", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (géré par black)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["arslm"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
